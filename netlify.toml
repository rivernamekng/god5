[build]
  publish = "."

# index.htmlは常に再検証させ、スマホ側に古いHTML(=古いapp.js/styles.cssの
# バージョンクエリを指すHTML)がキャッシュされ続けないようにする。
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
